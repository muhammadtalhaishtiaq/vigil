[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-risk"
version = "1.0.0"
description = "Multi-agent financial-risk copilot for your terminal — live market data + your own documents, framework-free."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["agents", "multi-agent", "financial-risk", "mcp", "terminal"]
dependencies = [
    "openai>=1.30,<2.0",
    "mcp>=1.2,<2.0",
    "rich>=13,<15",
    "yfinance>=0.2.40,<0.3",
    "requests>=2.31,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vigil = "vigil_cli:main"
vigil-mcp = "vigil_mcp:main"

[tool.setuptools]
py-modules = [
    "vigil_cli", "vigil_mcp", "agent_core", "agent_pipeline",
    "tools", "tracing", "data_layer", "session_store",
]

[tool.setuptools.packages.find]
include = ["prompts"]

[tool.setuptools.package-data]
prompts = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
